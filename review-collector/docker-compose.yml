services:
  review-collector:
    build: .
    container_name: review-collector
    restart: unless-stopped
    ports:
      - "8002:8000"
    environment:
      # QSM (Qoo10) 설정
      - QSM_ID=${QSM_ID}
      - QSM_PASSWORD=${QSM_PASSWORD}

      # 네이버 스마트스토어 설정
      - NAVER_ID=${NAVER_ID}
      - NAVER_PASSWORD=${NAVER_PASSWORD}
      - NAVER_COOKIE_PATH=/app/data/naver_cookies.json

      # 무신사 파트너 설정
      - MUSINSA_ID=${MUSINSA_ID}
      - MUSINSA_PASSWORD=${MUSINSA_PASSWORD}
      - MUSINSA_OTP_SECRET=${MUSINSA_OTP_SECRET}

      # Shopee 셀러센터 설정
      - SHOPEE_COOKIE_PATH=/app/data/shopee_cookies.json

      # 데이터베이스 설정 (Laravel DB)
      - DB_HOST=${DB_HOST:-mariadb}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:-qrcode}
      - DB_USERNAME=${DB_USERNAME:-test}
      - DB_PASSWORD=${DB_PASSWORD:-test}

      # Chrome 설정
      - CHROME_HEADLESS=true
      - CHROME_VERSION=${CHROME_VERSION:-0}
      - DOWNLOAD_PATH=/tmp/review_downloads
      - COOKIE_PATH=/app/data/qsm_cookies.json

      # 스케줄러 설정
      - SYNC_ENABLED=${SYNC_ENABLED:-false}
      - SYNC_HOURS=${SYNC_HOURS:-4,16}
      - SYNC_MINUTE=${SYNC_MINUTE:-0}

      # 로깅
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

    volumes:
      - ./data:/app/data
      - ./downloads:/tmp/review_downloads

    shm_size: '256m'

    deploy:
      resources:
        limits:
          memory: 1g

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - review-network

  postgres:
    image: postgres:13-alpine
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped
    networks:
      - review-network

  airflow:
    image: apache/airflow:2.8.1
    container_name: airflow
    depends_on:
      - postgres
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__WEBSERVER__SECRET_KEY: 'db2514eb163e82a0d6608c81bb7f934bb06414f790c0478b2e575f5a0301533d'
      # ── 리소스 절약 ──
      AIRFLOW__WEBSERVER__WORKERS: "1"
      AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "300"
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "600"
      AIRFLOW__CORE__PARALLELISM: "4"
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "2"
      AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: "1"
    volumes:
      - ./dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
    ports:
      - "8080:8080"
    command: >
      bash -c "
        airflow db migrate &&
        airflow users create --username admin --password admin
          --firstname Admin --lastname User --role Admin --email admin@essenciel.co.kr || true &&
        airflow scheduler &
        airflow webserver
      "
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    networks:
      - review-network

networks:
  review-network:
    driver: bridge

volumes:
  postgres-db:
  airflow-logs:
