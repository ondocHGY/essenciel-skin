name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            cd /var/www/essenciel-skin

            # 권한 수정 (배포 전)
            sudo chown -R $USER:$USER .
            sudo chown -R $USER:$USER .git

            # Git pull
            git fetch origin main
            git reset --hard origin/main

            # Install PHP dependencies
            composer install --no-dev --optimize-autoloader --no-interaction

            # Install Node dependencies and build assets
            npm ci
            npm run build

            # Run migrations
            php artisan migrate --force

            # Clear all cache
            php artisan optimize:clear

            # 권한 복구 (www-data가 접근할 수 있도록 - storage, bootstrap/cache만)
            sudo chown -R www-data:www-data storage bootstrap/cache
            sudo chmod -R 775 storage bootstrap/cache

            # Review Collector 재배포 (Docker)
            cd review-collector
            if [ -f .env ]; then
              docker build -t review-collector .
              docker stop review-collector 2>/dev/null || true
              docker rm review-collector 2>/dev/null || true
              docker run -d --name review-collector \
                -p 8000:8000 \
                -v $(pwd)/data:/app/data \
                --env-file .env \
                --restart unless-stopped \
                review-collector
              echo "Review Collector deployed successfully!"
            else
              echo "Review Collector .env not found, skipping..."
            fi
            cd ..

            # Review Collector Docker 배포
            cd /var/www/essenciel-skin/review-collector
            if [ -f "docker-compose.yml" ]; then
              echo "Deploying review-collector..."
              docker-compose down || true
              docker-compose up -d --build
              echo "Review collector deployed!"
            fi

            echo "Deployment completed successfully!"
